name: Android build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      # A valid-shaped placeholder keeps CI builds reproducible. Replace the local
      # file with the real Firebase config to run the app against your Firebase project.
      - name: Create build-only Firebase config when no secret is provided
        shell: bash
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          if [ -n "$FIREBASE_CONFIG_JSON" ]; then
            printf '%s' "$FIREBASE_CONFIG_JSON" > app/google-services.json
          else
            cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"123456789012","project_id":"captured-perspectives-ci","storage_bucket":"captured-perspectives-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef0123456789","android_client_info":{"package_name":"com.capturedperspectives.app"}},"oauth_client":[{"client_id":"123456789012-ci.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyDUMMY_CI_KEY_NOT_FOR_RUNTIME_0123456789"}],"services":{"appinvite_service":{"other_platform_oauth_client":[{"client_id":"123456789012-ci.apps.googleusercontent.com","client_type":3}]}}}],"configuration_version":"1"}
          JSON
          fi
      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
